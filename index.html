<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Deutschlandticket Wallet Pass</title>
    
    <!-- PWA / iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ÖPNV Pass">
    <meta name="theme-color" content="#f2f2f7">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #000000;
        }

        .phone-wrapper {
            width: 100vw;
            height: 100vh;
            max-width: 420px;
            max-height: 880px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
            position: relative;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            z-index: 10;
        }

        .top-bar-title {
            font-size: 20px;
            font-weight: 600;
            color: #000000;
        }

        .more-icon {
            width: 28px;
            height: 28px;
            background: #e5e5ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #1c1c1e;
        }

        .card-container {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
        }

        .wallet-card {
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px 24px 32px 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            user-select: none;
            touch-action: none;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease;
            cursor: grab;
        }

        .wallet-card:active {
            cursor: grabbing;
        }

        .wallet-card.swiping {
            transition: none;
        }

        .wallet-card.dismissed {
            transform: translateY(-900px) rotate(-12deg) !important;
            opacity: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nt-logo {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }

        .nt-dots {
            width: 24px;
            height: 24px;
            position: relative;
        }

        .nt-dots::before, .nt-dots::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }

        .nt-title {
            font-size: 13px;
            font-weight: 700;
            color: #1c1c1e;
        }

        .nt-sub {
            font-size: 11px;
            color: #e30613;
            font-weight: 600;
        }

        .header-title-text {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .icon-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .nfc-icon {
            width: 24px;
            height: 20px;
        }

        .flag-stripes {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 22px;
        }

        .stripe {
            height: 3px;
            border-radius: 2px;
        }
        .stripe.black { background: #000; }
        .stripe.red { background: #dd0000; }
        .stripe.gold { background: #ffcc00; }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #6c6c70;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .field-block {
            margin-bottom: 22px;
        }

        .val-date {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.8px;
            color: #000000;
        }

        .val-name {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #000000;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: flex-start;
        }

        .val-medium {
            font-size: 17px;
            font-weight: 500;
            color: #000000;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 16px;
        }

        .qr-box {
            width: 200px;
            height: 200px;
            background: #ffffff;
            padding: 4px;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .ticket-number {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #1c1c1e;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <div class="top-bar">
        <span class="top-bar-title">Fertig</span>
        <div class="more-icon">•••</div>
    </div>

    <div class="card-container">
        <div class="wallet-card" id="walletCard">
            <div class="card-header">
                <div class="brand-container">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                        <circle cx="8" cy="16" r="3" fill="#e30613"/>
                        <circle cx="16" cy="8" r="3" fill="#e30613"/>
                        <circle cx="16" cy="24" r="3" fill="#e30613"/>
                        <circle cx="24" cy="16" r="3.5" fill="#e30613"/>
                        <line x1="8" y1="16" x2="24" y2="16" stroke="#e30613" stroke-width="2"/>
                        <line x1="16" y1="8" x2="16" y2="24" stroke="#e30613" stroke-width="2"/>
                    </svg>
                    <div class="nt-logo">
                        <span class="nt-title">Niedersachsen</span>
                        <span class="nt-sub">tarif</span>
                    </div>
                </div>

                <div class="header-title-text">Deutschlandse...</div>

                <div class="icon-group">
                    <svg class="nfc-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M4 12C4 7.58172 7.58172 4 12 4" stroke="#007aff" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M7 12C7 9.23858 9.23858 7 12 7" stroke="#007aff" stroke-width="2.5" stroke-linecap="round"/>
                        <rect x="11" y="9" width="8" height="6" rx="1" fill="#007aff"/>
                    </svg>

                    <div class="flag-stripes">
                        <div class="stripe black"></div>
                        <div class="stripe red"></div>
                        <div class="stripe gold"></div>
                    </div>
                </div>
            </div>

            <div class="field-block">
                <div class="section-label">GÜLTIGKEITSZEITRAUM</div>
                <div class="val-date">01.10. – 31.03.27</div>
            </div>

            <div class="field-block">
                <div class="section-label">NAME</div>
                <div class="val-name">Keanu Fedko</div>
            </div>

            <div class="grid-2col">
                <div class="field-block" style="margin-bottom:0;">
                    <div class="section-label">GELTUNGSBEREICH</div>
                    <div class="val-medium">bundesweit im ÖPNV</div>
                </div>

                <div class="field-block" style="margin-bottom:0; text-align: right;">
                    <div class="section-label">KLASSE</div>
                    <div class="val-medium">2. Klasse</div>
                </div>
            </div>

            <div class="qr-section">
                <div class="qr-box">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <rect width="100" height="100" fill="white"/>
                        <!-- Position Pattern Top Left -->
                        <rect x="5" y="5" width="25" height="25" fill="black"/>
                        <rect x="8" y="8" width="19" height="19" fill="white"/>
                        <rect x="11" y="11" width="13" height="13" fill="black"/>
                        <!-- Position Pattern Top Right -->
                        <rect x="70" y="5" width="25" height="25" fill="black"/>
                        <rect x="73" y="8" width="19" height="19" fill="white"/>
                        <rect x="76" y="11" width="13" height="13" fill="black"/>
                        <!-- Position Pattern Bottom Left -->
                        <rect x="5" y="70" width="25" height="25" fill="black"/>
                        <rect x="8" y="73" width="19" height="19" fill="white"/>
                        <rect x="11" y="76" width="13" height="13" fill="black"/>
                        
                        <!-- Modified invalid center & data grid -->
                        <rect x="42" y="42" width="16" height="16" fill="black"/>
                        <rect x="45" y="45" width="10" height="10" fill="white"/>
                        <rect x="35" y="10" width="4" height="20" fill="black"/>
                        <rect x="10" y="35" width="20" height="4" fill="black"/>
                        <rect x="40" y="70" width="25" height="4" fill="black"/>
                        <rect x="70" y="40" width="4" height="25" fill="black"/>
                        <rect x="50" y="15" width="12" height="12" fill="black"/>
                        <rect x="15" y="50" width="12" height="12" fill="black"/>
                        <rect x="75" y="75" width="15" height="15" fill="black"/>
                    </svg>
                </div>
                <div class="ticket-number">101067101</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Service Worker registriert', reg))
                .catch(err => console.log('Service Worker Fehler', err));
        });
    }

    // Swipe Up Interaktions-Logik
    const card = document.getElementById('walletCard');
    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    card.addEventListener('touchstart', onStart, {passive: true});
    window.addEventListener('touchmove', onMove, {passive: false});
    window.addEventListener('touchend', onEnd);

    card.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    function onStart(e) {
        isDragging = true;
        card.classList.add('swiping');
        startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    }

    function onMove(e) {
        if (!isDragging) return;
        const y = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        const deltaY = y - startY;

        if (deltaY < 0) {
            currentY = deltaY;
            if (e.cancelable) e.preventDefault();
            card.style.transform = `translateY(${deltaY}px) rotate(${deltaY * 0.03}deg)`;
        }
    }

    function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        card.classList.remove('swiping');

        if (currentY < -130) {
            card.classList.add('dismissed');
            setTimeout(() => {
                card.classList.remove('dismissed');
                card.style.transform = 'translateY(0) rotate(0deg)';
            }, 650);
        } else {
            card.style.transform = 'translateY(0) rotate(0deg)';
        }
        currentY = 0;
    }
</script>
</body>
</html>
